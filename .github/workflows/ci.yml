name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js v22
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: npm install
        run: npm install

      - name: compact compile
        run: npm run compile

      - name: Run test suite
        run: npm test
